name: poc01

# Cada app roda com o mesmo limite: 2 vCPU e 512 MB.
# O stub fica sem limite para nunca ser o gargalo.

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 512M

services:
  stub:
    build: { context: ., args: { MODULE: stub } }
    ports: ["8081:8081"]

  mvc-platform:
    <<: *limits
    build: { context: ., args: { MODULE: app-mvc } }
    depends_on: [stub]
    environment:
      STUB_BASE_URL: http://stub:8081
      VIRTUAL_THREADS: "false"
    ports: ["8082:8080", "9092:9090"]

  mvc-platform-1000:
    <<: *limits
    build: { context: ., args: { MODULE: app-mvc } }
    depends_on: [stub]
    environment:
      STUB_BASE_URL: http://stub:8081
      VIRTUAL_THREADS: "false"
      SERVER_TOMCAT_THREADS_MAX: "1000"
    ports: ["8086:8080", "9096:9090"]

  mvc-virtual:
    <<: *limits
    build: { context: ., args: { MODULE: app-mvc } }
    depends_on: [stub]
    environment:
      STUB_BASE_URL: http://stub:8081
      VIRTUAL_THREADS: "true"
    ports: ["8083:8080", "9093:9090"]

  mvc-virtual-limited:
    <<: *limits
    build: { context: ., args: { MODULE: app-mvc } }
    depends_on: [stub]
    environment:
      STUB_BASE_URL: http://stub:8081
      VIRTUAL_THREADS: "true"
      MAX_CONCURRENT_REQUESTS: "1000"
    ports: ["8085:8080", "9095:9090"]

  webflux:
    <<: *limits
    build: { context: ., args: { MODULE: app-webflux } }
    depends_on: [stub]
    environment:
      STUB_BASE_URL: http://stub:8081
    ports: ["8084:8080", "9094:9090"]
