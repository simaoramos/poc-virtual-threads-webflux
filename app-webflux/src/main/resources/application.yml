spring:
  application:
    name: app-webflux
  reactor:
    context-propagation: auto   # leva traceId/MDC entre as threads do fluxo reativo

server:
  port: 8080

stub:
  base-url: ${STUB_BASE_URL:http://localhost:8081}
  max-concurrency: 2000   # mesmo limite do semáforo do MVC
  connect-timeout: 5s
  read-timeout: 5s

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,metrics
  tracing:
    sampling:
      probability: 1.0
